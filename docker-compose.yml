# 通用基础配置（YAML 锚点，多实例共用底层镜像与资源配置）
x-hermes-base: &hermes-base
  build: .
  image: hermes-cloud:latest
  shm_size: "2gb"
  restart: unless-stopped

services:
  # ===================================================
  # 实例 1（默认主实例）
  # 启动命令: docker compose up -d
  # ===================================================
  hermes-desktop-1:
    <<: *hermes-base
    container_name: hermes-desktop-1
    ports:
      - "${PORT_INSTANCE_1:-8444}:8444"
    environment:
      - DISABLE_AUTH=${DISABLE_AUTH:-true}
      - VNC_PASSWORD=${VNC_PASSWORD_1:-hermes}
      - REMOTE_DESKTOP_URL=https://${PUBLIC_HOST:-localhost}:${PORT_INSTANCE_1:-8444}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-z-ai/glm-5.3-flash}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}
    volumes:
      - ./entrypoint.sh:/root/entrypoint.sh
      - ./takeover_helper.py:/root/takeover_helper.py
      - ./data/instance-1/workspace:/root/workspace
      - ./data/instance-1/chrome-data:/root/.config/google-chrome
      - ./data/instance-1/hermes:/root/.hermes

  # ===================================================
  # 实例 2（预留从实例）
  # 启动命令: docker compose --profile multi up -d
  # 或单独启动: docker compose up -d hermes-desktop-2
  # ===================================================
  hermes-desktop-2:
    <<: *hermes-base
    container_name: hermes-desktop-2
    profiles:
      - multi
      - all
    ports:
      - "${PORT_INSTANCE_2:-8445}:8444"
    environment:
      - DISABLE_AUTH=${DISABLE_AUTH:-true}
      - VNC_PASSWORD=${VNC_PASSWORD_2:-hermes}
      - REMOTE_DESKTOP_URL=https://${PUBLIC_HOST:-localhost}:${PORT_INSTANCE_2:-8445}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-z-ai/glm-5.3-flash}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}
    volumes:
      - ./entrypoint.sh:/root/entrypoint.sh
      - ./takeover_helper.py:/root/takeover_helper.py
      - ./data/instance-2/workspace:/root/workspace
      - ./data/instance-2/chrome-data:/root/.config/google-chrome
      - ./data/instance-2/hermes:/root/.hermes
